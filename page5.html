<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<title>Page 5</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#f8ecdd;
font-family:'Playfair Display',serif;
}

.page{
height:100vh;
width:100%;
position:relative;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* PHOTO LETTERS */

.word{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
flex-wrap:wrap;
margin-top:-50px;
}

.photo-letter{

font-family:Arial Black,sans-serif;
font-size:220px;
font-weight:900;
line-height:1;

background-size:cover;
background-position:center;

-webkit-background-clip:text;
background-clip:text;

-webkit-text-fill-color:transparent;

-webkit-text-stroke:4px white;

filter:drop-shadow(0 8px 10px rgba(0,0,0,.2));

transition:.3s;
}

.photo-letter:hover{
transform:scale(1.05);
}

.s{
background-image:url("photo1.jpg");
}

.o{
background-image:url("photo2.jpg");
}

.r1{
background-image:url("photo3.jpg");
}

.r2{
background-image:url("photo4.jpg");
}

.y{
background-image:url("photo5.jpg");
}

/* MESSAGE */

.text{
margin-top:30px;
max-width:900px;
padding:0 30px;
text-align:center;
font-size:28px;
line-height:1.5;
color:#333;
}

.text div{
outline:none;
}

/* HEARTS */

.heart{
position:absolute;
font-size:70px;
color:#ff5da8;
animation:float 3s infinite ease-in-out;
}

.h1{
left:80px;
top:120px;
}

.h2{
right:100px;
top:170px;
}

.h3{
left:180px;
bottom:120px;
}

.h4{
right:180px;
bottom:150px;
}

/* BUTTERFLY */

.butterfly{
position:absolute;
right:120px;
top:80px;
width:130px;
animation:
float 3s infinite ease-in-out,
flutter .8s infinite ease-in-out;
}

@keyframes flutter{
0%,100%{
transform:rotate(-5deg);
}
50%{
transform:rotate(5deg);
}
}

@keyframes float{
50%{
transform:translateY(-15px);
}
}

/* ARROWS */

.prev,
.next{
position:absolute;
width:90px;
height:90px;
border-radius:50%;
background:#f7c6d7;
border:4px solid black;
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
cursor:pointer;
transition:.3s;
}

.prev:hover,
.next:hover{
transform:scale(1.1);
}

.prev{
left:20px;
top:50%;
}

.next{
right:20px;
top:50%;
}

/* MOBILE */

@media(max-width:900px){

.photo-letter{
font-size:110px;
-webkit-text-stroke:2px white;
}

.text{
font-size:18px;
}

.butterfly{
width:80px;
}

.heart{
font-size:40px;
}

.prev,.next{
width:65px;
height:65px;
font-size:30px;
}

}

</style>
</head>

<body>

<div class="page">

<div class="heart h1">♡</div>
<div class="heart h2">♡</div>
<div class="heart h3">♡</div>
<div class="heart h4">♡</div>

<img src="butter.png" class="butterfly">

<div class="word">

<div class="photo-letter s">S</div>
<div class="photo-letter o">O</div>
<div class="photo-letter r1">R</div>
<div class="photo-letter r2">R</div>
<div class="photo-letter y">Y</div>

</div>

<div class="text">
<div contenteditable="true">
No amount of words can truly undo the hurt I caused,
but I hope this little effort shows how deeply sorry I am.
I never wanted to be the reason for your sadness or the distance between us but just know that
If I could go back and fix things, I would puchkiii 🥺❤️
</div>
</div>

<div class="prev" onclick="window.location='page4.html'">
⬅
</div>

<div class="next" onclick="window.location='page6.html'">
➡
</div>

</div>

</body>
</html>
