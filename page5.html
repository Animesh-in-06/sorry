<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<title>Page 5</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow-x:hidden;
overflow-y:auto;
background:#f8ecdd;
font-family:'Playfair Display',serif;
}

.page{
min-height:100vh;
width:100%;
position:relative;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:40px 15px 120px;
}

/* PHOTO LETTERS */

.word{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
z-index:2;
}

.photo-letter{
font-family:Arial Black,sans-serif;
font-size:clamp(70px,18vw,220px);
font-weight:900;
line-height:1;

background-size:cover;
background-position:center;

-webkit-background-clip:text;
background-clip:text;

-webkit-text-fill-color:transparent;
-webkit-text-stroke:clamp(1px,0.5vw,4px) white;

filter:drop-shadow(0 8px 10px rgba(0,0,0,.2));

transition:.3s;
}

.photo-letter:hover{
transform:scale(1.05);
}

.s{
background-image:url("photo1.jpg");
}

.o{
background-image:url("photo2.jpg");
}

.r1{
background-image:url("photo3.jpg");
}

.r2{
background-image:url("photo4.jpg");
}

.y{
background-image:url("photo5.jpg");
}

/* MESSAGE */

.text{
margin-top:20px;
max-width:900px;
padding:0 15px;
text-align:center;
font-size:clamp(16px,4vw,28px);
line-height:1.6;
color:#333;
z-index:2;
}

.text div{
outline:none;
}

/* HEARTS */

.heart{
position:absolute;
font-size:clamp(25px,8vw,70px);
color:#ff5da8;
animation:float 3s infinite ease-in-out;
pointer-events:none;
}

.h1{
left:5%;
top:10%;
}

.h2{
right:8%;
top:15%;
}

.h3{
left:10%;
bottom:18%;
}

.h4{
right:10%;
bottom:20%;
}

/* BUTTERFLY */

.butterfly{
position:absolute;
right:5%;
top:5%;
width:clamp(60px,15vw,130px);
animation:
float 3s infinite ease-in-out,
flutter .8s infinite ease-in-out;
}

@keyframes flutter{
0%,100%{
transform:rotate(-5deg);
}
50%{
transform:rotate(5deg);
}
}

@keyframes float{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-15px);
}
}

/* ARROWS */

.prev,
.next{
position:fixed;
width:clamp(60px,16vw,90px);
height:clamp(60px,16vw,90px);
border-radius:50%;
background:#f7c6d7;
border:4px solid black;
display:flex;
justify-content:center;
align-items:center;
font-size:clamp(28px,6vw,42px);
cursor:pointer;
transition:.3s;
z-index:999;
user-select:none;
}

.prev:hover,
.next:hover{
transform:scale(1.1);
}

.prev{
left:15px;
bottom:15px;
}

.next{
right:15px;
bottom:15px;
}

/* Mobile */

@media(max-width:600px){

.page{
padding-top:80px;
}

.word{
gap:5px;
}

.text{
margin-top:15px;
font-size:18px;
}

.h3,
.h4{
display:none;
}

}

/* Tablets */

@media(min-width:601px) and (max-width:900px){

.text{
font-size:22px;
}

}

</style>
</head>

<body>

<div class="page">

<div class="heart h1">♡</div>
<div class="heart h2">♡</div>
<div class="heart h3">♡</div>
<div class="heart h4">♡</div>

<img src="butter.png" alt="Butterfly" class="butterfly">

<div class="word">

<div class="photo-letter s">S</div>
<div class="photo-letter o">O</div>
<div class="photo-letter r1">R</div>
<div class="photo-letter r2">R</div>
<div class="photo-letter y">Y</div>

</div>

<div class="text">
<div contenteditable="true">
No amount of words can truly undo the hurt I caused,
but I hope this little effort shows how deeply sorry I am.
I never wanted to be the reason for your sadness or the distance between us.
Just know that if I could go back and fix things, I would puchkiii 🥺❤️
</div>
</div>

<div class="prev" onclick="window.location.href='page4.html'">
⬅
</div>

<div class="next" onclick="window.location.href='page6.html'">
➡
</div>

</div>

</body>
</html>
