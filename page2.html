<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">

<title>Page 2</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
font-family:'Cormorant Garamond',serif;
}

.page{
height:100vh;
width:100%;
position:relative;
background:url("bg2.jpg");
background-size:cover;
background-position:center;
}

.label{
position:absolute;
top:12%;
left:50%;
transform:translateX(-50%);
background:#e7c37f;
padding:8px 20px;
font-size:38px;
font-style:italic;
}

.message{
position:absolute;
top:30%;
left:50%;
transform:translateX(-50%);
width:85%;
text-align:center;
font-size:42px;
line-height:1.3;
color:#1f1f1f;
}

.spiral{
position:absolute;
left:20px;
top:40px;
width:180px;
opacity:.5;
}

.string{
position:absolute;
right:0;
top:0;
width:350px;
}

.teddy{
position:absolute;
right:30px;
top:35%;
width:220px;
animation:float 3s infinite ease-in-out;
}

.prev,
.next{
position:absolute;
width:85px;
height:85px;
border-radius:50%;
background:#f7c6d7;
border:4px solid black;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
cursor:pointer;
}

.prev{
left:20px;
top:50%;
}

.next{
right:20px;
top:50%;
}

@keyframes float{
50%{
transform:translateY(-15px);
}
}

</style>
</head>

<body>

<section class="page">

<img src="spiral.png" class="spiral">
<!-- <img src="red-string.png" class="string"> -->
<img src="teddy.png" class="teddy">

<div class="label" contenteditable="true">
you mean the world to me
</div>

<div class="message" contenteditable="true">
isaaa you know how important you are to me you mean the whole world to me... ik i get hard over you sometimes and act toxic as you dont like but i am extremely sorry for acting that way.. 
</div>

<div class="prev" onclick="window.location='index.html'">
⬅
</div>

<div class="next" onclick="window.location='page3.html'">
➡
</div>

</section>

</body>
</html>
