<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">

<title>Apology Website</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
font-family:'Baloo 2',cursive;
}

.page{
height:100vh;
width:100%;
position:relative;
background:url("bg1.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
overflow:hidden;
}

.title{
position:absolute;
top:28%;
left:50%;
transform:translateX(-50%);
font-size:clamp(28px,7vw,55px);
color:#7d2d38;
text-align:center;
line-height:1.2;
width:90%;
padding:0 10px;
word-wrap:break-word;
}

.heart1{
position:absolute;
left:10%;
top:50%;
font-size:clamp(45px,12vw,90px);
color:#ff5aa5;
transform:rotate(-15deg);
}

.heart2{
position:absolute;
right:10%;
top:20%;
font-size:clamp(45px,12vw,90px);
color:#ff5aa5;
transform:rotate(10deg);
}

.sticker-left{
position:absolute;
left:3%;
top:25%;
width:clamp(70px,22vw,120px);
animation:float 2.5s infinite ease-in-out;
}

.sticker-right{
position:absolute;
right:5%;
top:42%;
width:clamp(60px,18vw,90px);
animation:float 3s infinite ease-in-out;
}

.next{
position:absolute;
right:8%;
bottom:12%;
width:clamp(65px,18vw,85px);
height:clamp(65px,18vw,85px);
border-radius:50%;
background:#f7c6d7;
border:4px solid black;
display:flex;
justify-content:center;
align-items:center;
font-size:clamp(28px,7vw,40px);
cursor:pointer;
transition:.3s;
user-select:none;
}

.next:hover{
transform:scale(1.1);
}

@keyframes float{
0%{
transform:translateY(0);
}
50%{
transform:translateY(-15px);
}
100%{
transform:translateY(0);
}
}

/* Phones */
@media (max-width:480px){

.title{
top:30%;
font-size:32px;
width:92%;
}

.heart1{
top:58%;
left:6%;
}

.heart2{
top:16%;
right:6%;
}

.sticker-left{
top:22%;
width:80px;
}

.sticker-right{
top:48%;
width:65px;
}

.next{
bottom:10%;
right:6%;
}
}

/* Tablets */
@media (min-width:481px) and (max-width:768px){

.title{
font-size:42px;
}

.sticker-left{
width:100px;
}

.sticker-right{
width:80px;
}
}

</style>
</head>

<body>

<section class="page">

<img src="pleading.png" alt="Pleading" class="sticker-left">
<img src="sad.png" alt="Sad" class="sticker-right">

<div class="heart1">♡</div>
<div class="heart2">♡</div>

<h1 class="title" contenteditable="true">
A little apology<br>
for messing up with my pisaaa babyy 🥺
</h1>

<div class="next" onclick="window.location.href='page2.html'">
➜
</div>

</section>

</body>
</html>
