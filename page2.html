<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">

<title>Page 2</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
font-family:'Cormorant Garamond',serif;
}

.page{
min-height:100dvh;
width:100%;
position:relative;
background:url("bg2.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
overflow:hidden;
padding-bottom:120px;
}

.label{
position:absolute;
top:10%;
left:50%;
transform:translateX(-50%);
background:#e7c37f;
padding:8px 20px;
font-size:clamp(22px,5vw,38px);
font-style:italic;
text-align:center;
white-space:nowrap;
z-index:2;
}

.message{
position:absolute;
top:28%;
left:50%;
transform:translateX(-50%);
width:90%;
text-align:center;
font-size:clamp(24px,5vw,42px);
line-height:1.3;
color:#1f1f1f;
z-index:2;
}

.spiral{
position:absolute;
left:10px;
top:20px;
width:clamp(90px,25vw,180px);
opacity:.5;
}

.string{
position:absolute;
right:0;
top:0;
width:clamp(180px,40vw,350px);
}

.teddy{
position:absolute;
right:3%;
top:52%;
transform:translateY(-50%);
width:clamp(110px,30vw,220px);
animation:float 3s infinite ease-in-out;
z-index:1;
}

.prev,
.next{
position:absolute;
width:clamp(60px,16vw,85px);
height:clamp(60px,16vw,85px);
border-radius:50%;
background:#f7c6d7;
border:4px solid black;
display:flex;
justify-content:center;
align-items:center;
font-size:clamp(28px,6vw,40px);
cursor:pointer;
z-index:999;
user-select:none;
bottom:40px;
}

.prev{
left:15px;
}

.next{
right:15px;
}

@keyframes float{
0%{
transform:translateY(-50%);
}
50%{
transform:translateY(calc(-50% - 15px));
}
100%{
transform:translateY(-50%);
}
}

/* Mobile Phones */
@media (max-width:480px){

.page{
padding-bottom:140px;
}

.label{
top:8%;
font-size:24px;
padding:6px 14px;
}

.message{
top:24%;
width:88%;
font-size:28px;
line-height:1.25;
}

.teddy{
width:120px;
right:2%;
top:72%;
}

.spiral{
width:100px;
}

.prev,
.next{
width:65px;
height:65px;
font-size:30px;
bottom:70px; /* moved higher */
}

}

/* Tablets */
@media (min-width:481px) and (max-width:768px){

.message{
font-size:34px;
}

.teddy{
width:170px;
}

.prev,
.next{
bottom:55px;
}

}

</style>
</head>

<body>

<section class="page">

<img src="spiral.png" alt="Spiral" class="spiral">
<!-- <img src="red-string.png" alt="String" class="string"> -->
<img src="teddy.png" alt="Teddy Bear" class="teddy">

<div class="label" contenteditable="true">
you mean the world to me
</div>

<div class="message" contenteditable="true">
isaa you know how important you are to me, you mean the whole world to me... ik i get hard over you sometimes and act toxic as you don't like, but i am extremely sorry for acting that way..
</div>

<div class="prev" onclick="window.location.href='index.html'">
⬅
</div>

<div class="next" onclick="window.location.href='page3.html'">
➡
</div>

</section>

</body>
</html>
